# Template for compose.yml. Edit THIS file, then run:
#   python scripts/render_config.py
# The generated compose.yml has one backend service per app/dialects/<code>.json
# (each with its own mem_limit from that file) plus the proxy's depends_on, so
# adding a dialect needs no compose edits here.
#
# Each backend builds (and runs) its OWN per-dialect image carrying only that
# dialect's model: image ${NUHA_IMAGE_PREFIX:-nuha-api}:${NUHA_IMAGE_TAG_PREFIX:-}<code>,
# built with --build-arg DIALECT=<code> (see the generated per-service build
# sections). With both vars unset, `docker compose build` produces the local
# nuha-api:<code> images and `docker compose up` runs them. To run CI-published
# images, set NUHA_IMAGE_PREFIX to the registry repo and pick a channel with
# NUHA_IMAGE_TAG_PREFIX (stable- or latest-); CI publishes only channel-first
# tags, never a bare <code>. The image/build/DIALECT lines are per-dialect, so
# they are rendered per service; only the truly shared bits live in this anchor.
name: nuha-api

x-backend: &backend
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - >
        import urllib.request;
        urllib.request.urlopen("http://localhost:8000/health", timeout=5)
    # timeout is generous: under a CPU-saturated burst the event loop that serves
    # /health is briefly starved, and a tight timeout would mark a busy-but-healthy
    # backend unhealthy and trigger a needless recycle. 10s x 3 retries means a
    # backend must be unresponsive for ~30s before it is considered down.
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s

services:
  proxy:
    # Digest-pinned like the Dockerfile base images: the tag alone is mutable.
    # To bump: `docker buildx imagetools inspect nginx:<new-tag>` for the digest.
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: nuha-api-proxy
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Dialect whose backend the proxy routes the docs pages to.
      # Filled into the generated routing config at container start by nginx's
      # built-in envsubst; NGINX_ENVSUBST_FILTER limits substitution to this one
      # var so nginx's own $variables are left intact.
      # The ':-arz' fallback here is the SOURCE default; render_config.py rewrites
      # it in the generated compose.yml to 'arz' if that dialect exists, else the
      # first dialect alphabetically, so it never dangles when arz is absent.
      - DEFAULT_DIALECT=${DEFAULT_DIALECT:-arz}
      - NGINX_ENVSUBST_FILTER=DEFAULT_DIALECT
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Committed, generated routing template (one entry per dialect). nginx
      # renders /etc/nginx/conf.d/dialects.conf from it at startup.
      - ./nginx/dialects.conf.template:/etc/nginx/templates/dialects.conf.template:ro
    deploy:
      resources:
        limits:
          cpus: "${PROXY_CPU_LIMIT:-1.0}"
          memory: ${PROXY_MEM_LIMIT:-256m}
    depends_on:
# __PROXY_DEPENDS_ON__  (generated)

# __BACKENDS__  (generated: one service per dialect)
