# Template for .woodpecker/build-latest-image.yaml. Edit THIS file, then run:
#   python scripts/render_config.py
# Like compose.template.yml, this is the hand-edited source; the file in
# .woodpecker/ is generated from it and must not be edited. render_config.py
# fills the two markers below with one entry per app/dialects/<code>.json, so
# adding a dialect needs no edit here. The templates live in woodpecker-templates/,
# not in .woodpecker/, because anything *.yaml under .woodpecker/ is parsed as a
# pipeline.
when:
  - event: [push, manual]
    branch:
      exclude: [main]
  - event: [pull_request]
    evaluate: 'CI_COMMIT_TARGET_BRANCH != "main"'

variables:
  - &registry_url "https://registry.cloud.josa.ngo"
  - &docker_repo "registry.cloud.josa.ngo/library/nuha-api"
  - &slack_channel "builds"
  - &success_message >
    ✅ *SUCCESS* - Latest Build #{{ build.number }}

    📁 *Repository:* {{ repo.name }}
    🌿 *Branch:* {{ build.branch }}
    📝 *Commit:* {{ truncate build.commit 8 }}
    👤 *Author:* {{ build.author }}

    🔗 *Links:*
    • <{{ build.link }}|View Build>
  - &failure_message >
    ❌ *FAILED* - Latest Build #{{ build.number }}

    📁 *Repository:* {{ repo.name }}
    🌿 *Branch:* {{ build.branch }}
    📝 *Commit:* {{ truncate build.commit 8 }}
    👤 *Author:* {{ build.author }}

    🔗 *Links:*
    • <{{ build.link }}|View Build>

steps:
  - name: run-pre-commit-hooks
    image: registry.cloud.josa.ngo/library/pre-commit-runner
    settings:
      args: "--all-files"
      skip: "end-of-file-fixer, run-samplr"

  # Verify requirements.lock has not drifted from requirements.txt: regenerate
  # it in this pinned Python and fail if the committed lock differs. Catches a
  # requirements.txt change that forgot to regenerate the lock.
  - name: check-lockfile
    image: python:3.12-slim
    commands:
      - pip install --no-cache-dir pip-tools==7.5.3
      - python scripts/check_lock.py

  # One image PER DIALECT: each bakes only its own model (selected by the
  # DIALECT build_arg, which the Dockerfile reads to download that dialect's
  # hf_repo from app/dialects/<code>.json). The dialect code is the image tag
  # (nuha-api:arz, ...), matching how compose tags them via
  # ${NUHA_IMAGE_PREFIX}:<code>. Each dialect also gets channel + SHA-pinned
  # tags (<code>-latest, <code>-latest-${CI_COMMIT_SHA}) for rollback. The
  # buildx-plugin CI_* metadata args are preserved and the model repos are still
  # read from app/dialects/ at build time (public repos, no HF token). Each build
  # depends on check-lockfile, so a drifted lock blocks all of them and no
  # stale-lock image is pushed.
# __BUILD_STEPS__  (generated: one build step per dialect)

  - name: notify-slack-latest-success
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: *slack_channel
      template: *success_message
    when:
      - status: success
    depends_on:
      - run-pre-commit-hooks
      - check-lockfile
# __BUILD_DEPENDS__  (generated: one entry per dialect)

  - name: notify-slack-latest-failure
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: *slack_channel
      template: *failure_message
    when:
      - status: failure
    depends_on:
      - run-pre-commit-hooks
      - check-lockfile
# __BUILD_DEPENDS__  (generated: one entry per dialect)
