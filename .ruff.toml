# =============================================================================
# Ruff Configuration
# =============================================================================
# Fast Python linter and formatter.
# Documentation: https://docs.astral.sh/ruff/
# =============================================================================

# Target Python version
target-version = "py312"

# Line length (matches Black default)
line-length = 100

# Exclude paths
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".eggs",
    "*.egg-info",
    "build",
    "dist",
    "model",
]

# =============================================================================
# Linter Configuration
# =============================================================================
[lint]
# Enable these rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
]

# Ignore these specific rules
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "B904",   # raise without from inside except (too strict)
    "SIM108", # use ternary operator (reduces readability sometimes)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# Tests can use assert and have longer lines
"tests/**/*.py" = ["S101", "E501"]
# Init files can have unused imports (re-exports)
"__init__.py" = ["F401"]

[lint.isort]
known-first-party = ["app"]
force-single-line = false
lines-after-imports = 2

# =============================================================================
# Formatter Configuration
# =============================================================================
[format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Unix-style line endings
line-ending = "lf"

# Enable auto-detection of magic trailing comma
skip-magic-trailing-comma = false

# Format docstrings
docstring-code-format = true
