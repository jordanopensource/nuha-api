events {
    worker_connections 1024;
}

http {
    # Docker internal DNS — required for resolving container names in variables.
    resolver 127.0.0.11 valid=10s;

    # Security: hide nginx version
    server_tokens off;

    # Client-facing timeouts stay tight to harden against slow clients. The long
    # backend read timeout is NOT set here: it lives on the proxied classification
    # locations below, so it only covers slow inference and does not also stretch
    # the docs and health endpoints.
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;
    proxy_connect_timeout 5s;

    # Proxy buffer limits
    proxy_buffer_size 8k;
    proxy_buffers 8 8k;
    proxy_busy_buffers_size 16k;

    # Rate limiting (per-IP)
    limit_req_zone $binary_remote_addr zone=classify:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=batch:10m rate=20r/s;
    limit_req_status 429;

    # Dialect routing. nginx renders /etc/nginx/conf.d/dialects.conf at startup
    # from the mounted, generated nginx/dialects.conf.template (envsubst fills
    # ${DEFAULT_DIALECT}). This defines $dialect_backend, $docs_backend, and
    # $invalid_dialect_msg — no dialect is hardcoded here.
    include /etc/nginx/conf.d/dialects.conf;

    server {
        listen 8000;

        # Request size limit and the real aggregate DoS backstop. The app caps an
        # individual text at 50000 chars, but the binding limit on a batch body is
        # HERE: 25 MiB total, independent of MAX_BATCH_SIZE x per-text length.
        # Normal Arabic/Kurdish batches (~2 bytes/char) sit far under it; an
        # oversized batch is rejected with 413 before reaching the app. Inference
        # cost does not grow with input length (the tokenizer truncates to the
        # model's token limit), so this byte cap — not the per-text char cap — is
        # what bounds per-request memory and bandwidth. Raise it only to serve
        # larger legitimate batches.
        client_max_body_size 25m;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # Proxy-level health check (backend health is managed by compose healthchecks)
        location = /health {
            default_type application/json;
            return 200 '{"status":"healthy"}';
        }

        # API docs — dialect-independent, served from the default dialect backend
        location = /docs {
            proxy_pass http://$docs_backend;
        }
        location = /redoc {
            proxy_pass http://$docs_backend;
        }
        location = /openapi.json {
            proxy_pass http://$docs_backend;
        }

        # Reject unrecognized dialect values early (no-dialect falls back to the default)
        error_page 460 = @invalid_dialect;
        if ($dialect_backend = "") {
            return 460;
        }

        location @invalid_dialect {
            default_type application/json;
            return 400 '{"detail":"$invalid_dialect_msg"}';
        }

        # Batch endpoint — stricter rate limit (inference is expensive)
        location = /classify/batch {
            limit_req zone=batch burst=50 nodelay;
            # A large batch is one slow inference that sends nothing until it is
            # done. The app owns the real cap and returns its own clean 503/504,
            # so this only backstops a backend that hangs. It MUST stay above the
            # app's full latency budget = INFERENCE_QUEUE_TIMEOUT (30s wait for a
            # slot) + INFERENCE_TIMEOUT (120s inference) = 150s; if you raise
            # either, raise this to match.
            proxy_read_timeout 155s;
            proxy_pass http://$dialect_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Classification endpoints — route by dialect
        location / {
            limit_req zone=classify burst=200 nodelay;
            # Backstop for a hung backend; the app returns the real 503/504 first.
            # Keep above INFERENCE_QUEUE_TIMEOUT + INFERENCE_TIMEOUT = 150s (see
            # /classify/batch).
            proxy_read_timeout 155s;
            proxy_pass http://$dialect_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
