events {
    worker_connections 1024;
}

http {
    # Docker internal DNS, so the api upstream resolves per request (a variable
    # proxy_pass below) and picks up api replicas as they scale, rather than
    # caching one address at config load.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Hide the nginx version.
    server_tokens off;

    # Client-facing timeouts stay tight to harden against slow clients. The long
    # backend read timeout is NOT set here: it lives on the proxied classify
    # locations below, so it only covers slow inference and does not also stretch
    # the docs and health endpoints.
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;
    proxy_connect_timeout 5s;

    # Proxy buffer limits.
    proxy_buffer_size 8k;
    proxy_buffers 8 8k;
    proxy_busy_buffers_size 16k;

    # Recover the real client IP when this proxy sits behind another one (a CDN
    # or load balancer), so the per-IP rate limits below key on the
    # actual client rather than the single upstream IP that would otherwise share
    # one bucket. We rewrite $binary_remote_addr from X-Forwarded-For, but only
    # when the connection comes from a trusted private or loopback range where
    # such a proxy sits. A direct public client cannot spoof the header: its peer
    # IP is not in these ranges, so its X-Forwarded-For is ignored and its own IP
    # is used. If your fronting proxy is on a public IP, add its address here.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Rate limiting (per-IP, on the real client IP recovered above).
    limit_req_zone $binary_remote_addr zone=classify:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=batch:10m rate=20r/s;
    # Ceiling per CONNECTION PEER ($realip_remote_addr is the TCP source address
    # BEFORE the X-Forwarded-For rewrite above). The per-client zones key on a
    # client-supplied header when the peer is in the trusted ranges, so a peer
    # that fakes a fresh X-Forwarded-For per request would otherwise get a fresh
    # bucket every time. These zones cap what any single peer (a fronting proxy
    # carrying many real clients, or a spoofing host) can send in total: 30x the
    # per-client rate, generous for a legitimate proxy, finite for an abuser.
    limit_req_zone $realip_remote_addr zone=classify_peer:10m rate=3000r/s;
    limit_req_zone $realip_remote_addr zone=batch_peer:10m rate=600r/s;
    # Docs and any other backend path are cheap but proxied; keep them bounded.
    limit_req_zone $binary_remote_addr zone=other:1m rate=10r/s;
    limit_req_status 429;

    # The single stateless api serves every dialect and owns dialect validation
    # (unknown dialect -> 400) and its own dynamic dialect set, so this proxy
    # does NOT carry a per-dialect map: a dialect added to the volume at runtime
    # is served without touching this config. The proxy adds the edge concerns
    # the app leaves to the platform: TLS termination (add a listen 443 + certs),
    # per-IP rate limiting, a body cap, and security headers.
    server {
        listen 8000;

        # Body cap and the real aggregate backstop, ahead of the app's own limit.
        # A normal batch of short Arabic/Kurdish comments (~2 bytes/char) sits well
        # under 10 MiB; a larger one is rejected with 413 before reaching the app.
        client_max_body_size 10m;

        # Security headers on every proxied response.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # The api upstream, as a variable so the resolver above re-resolves it per
        # request (replica round-robin). It is the one backend for everything.
        set $api_upstream api:8000;

        # Liveness and readiness pass straight through to the app.
        location = /health {
            proxy_pass http://$api_upstream;
        }
        location = /ready {
            proxy_pass http://$api_upstream;
        }

        # Batch classify: stricter limit (inference is expensive); both zones
        # apply, per-client (spoofable behind a trusted peer) AND the per-peer
        # ceiling. The dialect travels in the path and the app validates it.
        location ~ ^/[a-z]+/classify/batch$ {
            limit_req zone=batch burst=50 nodelay;
            limit_req zone=batch_peer burst=1500 nodelay;
            # A large batch is one slow inference (one forward pass per ensemble
            # member) that sends nothing until it is done. The app owns the real
            # cap and returns its own clean 503/504, so this only backstops a
            # backend that hangs. It MUST stay above the app's full latency budget
            # = INFERENCE_QUEUE_TIMEOUT (30s wait for a slot) + INFERENCE_TIMEOUT
            # (120s inference) = 150s; if you raise either, raise this to match.
            proxy_read_timeout 155s;
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Single classify, dialect in the path.
        location ~ ^/[a-z]+/classify$ {
            limit_req zone=classify burst=200 nodelay;
            limit_req zone=classify_peer burst=6000 nodelay;
            proxy_read_timeout 155s;
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else (docs, openapi, an unknown dialect, a bad path) goes to
        # the app, which answers with its frozen contract (400/404/405/422) under
        # a light per-IP limit.
        location / {
            limit_req zone=other burst=20 nodelay;
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
