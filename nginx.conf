events {
    worker_connections 1024;
}

http {
    # Docker internal DNS, required for resolving container names in variables.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security: hide nginx version
    server_tokens off;

    # Client-facing timeouts stay tight to harden against slow clients. The long
    # backend read timeout is NOT set here: it lives on the proxied classification
    # locations below, so it only covers slow inference and does not also stretch
    # the docs and health endpoints.
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;
    proxy_connect_timeout 5s;

    # Proxy buffer limits
    proxy_buffer_size 8k;
    proxy_buffers 8 8k;
    proxy_busy_buffers_size 16k;

    # Recover the real client IP when this proxy sits behind another one (a CDN,
    # load balancer, or ingress), so the per-IP rate limits below key on the
    # actual client rather than the single upstream IP that would otherwise share
    # one bucket. We rewrite $binary_remote_addr from X-Forwarded-For, but only
    # when the connection comes from a trusted private or loopback range where
    # such a proxy sits. A direct public client cannot spoof the header: its peer
    # IP is not in these ranges, so its X-Forwarded-For is ignored and its own IP
    # is used. If your fronting proxy is on a public IP, add its address here.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Rate limiting (per-IP, on the real client IP recovered above)
    limit_req_zone $binary_remote_addr zone=classify:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=batch:10m rate=20r/s;
    # Ceiling per CONNECTION PEER ($realip_remote_addr is the TCP source address
    # BEFORE the X-Forwarded-For rewrite above). The per-client zones key on a
    # client-supplied header when the peer is in the trusted ranges, so a peer
    # that fakes a fresh X-Forwarded-For per request would otherwise get a fresh
    # bucket every time -- unlimited in aggregate. These zones cap what any
    # single peer (a fronting proxy carrying many real clients, or a spoofing
    # host) can send in total: 30x the per-client rate, generous for a legitimate
    # proxy, finite for an abuser.
    limit_req_zone $realip_remote_addr zone=classify_peer:10m rate=3000r/s;
    limit_req_zone $realip_remote_addr zone=batch_peer:10m rate=600r/s;
    # Docs are cheap but proxied; keep the only unauthenticated non-classify
    # path to a backend bounded too.
    limit_req_zone $binary_remote_addr zone=docs:1m rate=10r/s;
    limit_req_status 429;

    # Dialect routing. nginx renders /etc/nginx/conf.d/dialects.conf at startup
    # from the mounted, generated nginx/dialects.conf.template (envsubst fills
    # ${DEFAULT_DIALECT}). This defines $path_backend, $default_backend, and
    # $invalid_dialect_msg; no dialect is hardcoded here.
    include /etc/nginx/conf.d/dialects.conf;

    server {
        listen 8000;

        # Request size limit and the real aggregate DoS backstop. The app caps an
        # individual text at 50000 chars, but the binding limit on a batch body is
        # HERE: 10 MiB total, independent of MAX_BATCH_SIZE x per-text length.
        # A normal batch of short Arabic/Kurdish comments (~2 bytes/char) sits well
        # under it; a batch of unusually long texts that exceeds it is rejected with
        # 413 before reaching the app. Inference cost does not grow with input
        # length (the tokenizer truncates to the model's token limit), so this byte
        # cap (not the per-text char cap) bounds per-request memory and bandwidth.
        # Raise it only to serve larger legitimate batches.
        client_max_body_size 10m;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # Proxy-level health check (backend health is managed by compose healthchecks)
        location = /health {
            default_type application/json;
            return 200 '{"status":"healthy"}';
        }

        # API docs: dialect-independent, served from the default dialect backend.
        # (The backends ship with DISABLE_DOCS=1 in .env, so these return the
        # app's 404 unless docs are re-enabled; rate-limited either way.)
        location = /docs {
            limit_req zone=docs burst=20 nodelay;
            proxy_pass http://$default_backend;
        }
        location = /redoc {
            limit_req zone=docs burst=20 nodelay;
            proxy_pass http://$default_backend;
        }
        location = /openapi.json {
            limit_req zone=docs burst=20 nodelay;
            proxy_pass http://$default_backend;
        }

        # An unrecognized dialect in the PATH returns 460, mapped here to a JSON
        # 400. The path locations below do the $path_backend = "" -> 460 check;
        # the dialect travels only in the path, so there is no server-level
        # dialect check to do here.
        error_page 460 = @invalid_dialect;

        location @invalid_dialect {
            default_type application/json;
            return 400 '{"detail":"$invalid_dialect_msg"}';
        }

        # Path-based dialect routing: /<dialect>/classify/batch and
        # /<dialect>/classify. The dialect $dia is captured from the path by the
        # location regex and mapped to $path_backend (unknown dialect -> "" ->
        # 460 -> 400). These regex locations take precedence over the "/" catch-all
        # below. The two regexes are disjoint (the single one is anchored with $
        # right after /classify). Each carries both rate-limit zones: per-client
        # plus the per-peer ceiling.

        # Batch: stricter rate limit (inference is expensive); both zones apply
        # -- per-client (spoofable behind a trusted peer) AND the per-peer ceiling.
        location ~ ^/(?<dia>[a-z]+)/classify/batch$ {
            if ($path_backend = "") { return 460; }
            limit_req zone=batch burst=50 nodelay;
            limit_req zone=batch_peer burst=1500 nodelay;
            # A large batch is one slow inference that sends nothing until it is
            # done. The app owns the real cap and returns its own clean 503/504,
            # so this only backstops a backend that hangs. It MUST stay above the
            # app's full latency budget = INFERENCE_QUEUE_TIMEOUT (30s wait for a
            # slot) + INFERENCE_TIMEOUT (120s inference) = 150s; if you raise
            # either, raise this to match.
            proxy_read_timeout 155s;
            proxy_pass http://$path_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Single classify, dialect in the path
        location ~ ^/(?<dia>[a-z]+)/classify$ {
            if ($path_backend = "") { return 460; }
            limit_req zone=classify burst=200 nodelay;
            limit_req zone=classify_peer burst=6000 nodelay;
            proxy_read_timeout 155s;
            proxy_pass http://$path_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Anything that is not a classify route above or a docs/health location
        # is unknown; answer with a JSON 404 without troubling a backend.
        location / {
            default_type application/json;
            return 404 '{"detail":"Not Found"}';
        }
    }
}
