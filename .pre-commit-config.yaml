default_install_hook_types:
  - pre-commit
  - pre-push
  - commit-msg
default_stages:
  - pre-commit
  - pre-push
repos:
  - hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
    repo: meta
  - hooks:
      - args:
          - --allow-multiple-documents
        id: check-yaml
        types: ['yaml']
      - id: check-toml
        types: ['toml']
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: trailing-whitespace
      - id: end-of-file-fixer
    repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
  - hooks:
      - id: ruff-check
        name: ruff (lint)
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        name: ruff (format)
        types_or: [python, pyi]
    repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.9
  - hooks:
      - id: yamllint
        args: [--strict, -c=.yamllint]
        # Exclude CI files: Woodpecker uses Go templates ({{ }}) that aren't valid YAML
        exclude: '(.github|tests|.woodpecker)/.*'
    repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
  - hooks:
      - id: run-samplr
    repo: https://github.com/jordanopensource/pre-commit-hooks
    rev: v0.4.5
  # compose.yml and nginx/dialects.conf.template are generated from app/dialects/
  # (Compose can't loop, nginx can't read JSON). Like run-samplr keeps .sample.env
  # current, this regenerates both on commit so they never drift from the dialect
  # files or from each other.
  - hooks:
      - id: render-config
        name: regenerate compose.yml + nginx routing from app/dialects/
        entry: python scripts/render_config.py
        language: system
        pass_filenames: false
        files: '^(app/dialects/.*\.json|compose\.template\.yml)$'
    repo: local
  - hooks:
      - id: gitleaks
        name: detect hardcoded secrets
    repo: https://github.com/zricethezav/gitleaks
    rev: v8.26.0
  - hooks:
      - id: commitizen
        stages:
          - commit-msg
    repo: https://github.com/commitizen-tools/commitizen
    rev: v4.7.1
