# Nginx-fronted deployment overlay. Layer it on the base compose file:
#
#   docker compose -f compose.yml -f compose.nginx.yml up -d
#
# It puts an nginx proxy in front of the one api and makes the proxy the only
# published entry point, so a deployment with no edge of its own still gets a TLS
# termination point, per-IP and per-peer rate limiting, a body cap, and security
# headers. The base `docker compose up` (without this file) runs the api on the
# host port directly, for a platform that already provides the edge.
#
# Adding a dialect is unchanged in either mode: the proxy carries no per-dialect
# config, so a dialect added to the volume is served with no edit here or to
# nginx.conf.
services:
  api:
    # The proxy is the only published entry point in this mode; drop the api's
    # host port so the two do not both bind ${PORT}.
    ports: !reset []

  proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    # Drain in lockstep with the api it fronts: on stop, nginx forwards SIGQUIT to
    # its workers (needs CAP_KILL below) so they finish in-flight requests. Match
    # the api's window so a proxied request still being served can complete.
    stop_grace_period: 160s
    cap_drop: [ALL]
    # nginx's official image runs a root master that chowns its cache and temp
    # paths, drops the workers to the nginx user, and forwards SIGQUIT to them for
    # a graceful drain. cap_drop ALL removes what it needs, so add back exactly
    # those four (it binds 8000, so no NET_BIND_SERVICE is needed).
    cap_add: [CHOWN, SETGID, SETUID, KILL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: "${PROXY_CPU_LIMIT:-1.0}"
          memory: ${PROXY_MEM_LIMIT:-256m}
