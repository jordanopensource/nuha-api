# GENERATED by scripts/render_config.py. Do not edit.
# Edit woodpecker-templates/latest.yaml or add/remove app/dialects/<code>.json,
# then re-run: python scripts/render_config.py
when:
  - event: [push, manual]
    branch:
      exclude: [main]
  - event: [pull_request]
    evaluate: 'CI_COMMIT_TARGET_BRANCH != "main"'

variables:
  - &registry_url "https://registry.cloud.josa.ngo"
  - &docker_repo "registry.cloud.josa.ngo/library/nuha-api"
  - &slack_channel "builds"
  - &success_message >
    ✅ *SUCCESS* - Latest Build #{{ build.number }}

    📁 *Repository:* {{ repo.name }}
    🌿 *Branch:* {{ build.branch }}
    📝 *Commit:* {{ truncate build.commit 8 }}
    👤 *Author:* {{ build.author }}

    🔗 *Links:*
    • <{{ build.link }}|View Build>
  - &failure_message >
    ❌ *FAILED* - Latest Build #{{ build.number }}

    📁 *Repository:* {{ repo.name }}
    🌿 *Branch:* {{ build.branch }}
    📝 *Commit:* {{ truncate build.commit 8 }}
    👤 *Author:* {{ build.author }}

    🔗 *Links:*
    • <{{ build.link }}|View Build>

steps:
  - name: run-pre-commit-hooks
    image: registry.cloud.josa.ngo/library/pre-commit-runner
    settings:
      args: "--all-files"
      skip: "end-of-file-fixer, run-samplr"

  # Verify requirements.lock has not drifted from requirements.txt: regenerate
  # it in this pinned Python and fail if the committed lock differs. Catches a
  # requirements.txt change that forgot to regenerate the lock.
  - name: check-lockfile
    image: python:3.12-slim@sha256:423ed6ab25b1921a477529254bfeeabf5855151dc2c3141699a1bfc852199fbf
    commands:
      - pip install --no-cache-dir pip-tools==7.5.3
      - python scripts/check_lock.py

  # Run the full pytest suite once per dialect BEFORE any image is built, so an
  # untested change can never reach a pushed image. Runtime deps come from the
  # same hashed lock the image installs; the dialect list is discovered from
  # app/dialects/*.json at run time, so a new dialect is tested with no CI edit
  # (the same single-source-of-truth rule as the generated build steps).
  - name: run-tests
    image: python:3.12-slim@sha256:423ed6ab25b1921a477529254bfeeabf5855151dc2c3141699a1bfc852199fbf
    commands:
      - pip install --no-cache-dir --require-hashes -r requirements.lock
      - pip install --no-cache-dir -r requirements-test.txt
      - |
        for f in app/dialects/*.json; do
          d="$(basename "$f" .json)"
          echo "=== pytest (DIALECT=$d) ==="
          DIALECT="$d" python -m pytest -q || exit 1
        done

  # One image PER DIALECT: each bakes only its own model (selected by the
  # DIALECT build_arg, which the Dockerfile reads to download that dialect's
  # hf_repo from app/dialects/<code>.json). Published tags carry an EXPLICIT
  # channel only: <code>-latest plus the SHA-pinned <code>-latest-${CI_COMMIT_SHA}
  # for rollback. No bare <code> tag is pushed -- this pipeline runs on every
  # non-main branch, so a bare tag would let any WIP push overwrite the default
  # a registry deploy pulls; compose picks a channel via NUHA_IMAGE_TAG_SUFFIX
  # instead. The buildx-plugin CI_* metadata args are preserved and the model
  # repos are still read from app/dialects/ at build time (public repos, no HF
  # token). Each build depends on check-lockfile and run-tests, so a drifted
  # lock or a failing test blocks all of them and no untested image is pushed.
  - name: build-latest-image-acm
    image: woodpeckerci/plugin-docker-buildx:6.1.0
    settings:
      repo: *docker_repo
      registry: *registry_url
      dockerfile: ./Dockerfile
      tags:
        - acm
        - acm-latest
        - acm-latest-${CI_COMMIT_SHA}
      username:
        from_secret: REGISTRY_USERNAME
      password:
        from_secret: REGISTRY_SECRET
      build_args:
        DIALECT: acm
        CI_COMMIT_SHA: ${CI_COMMIT_SHA}
        CI_REPO_URL: ${CI_REPO_URL}
        CI_PIPELINE_CREATED: ${CI_PIPELINE_CREATED}
    depends_on:
      - run-pre-commit-hooks
      - check-lockfile
      - run-tests

  - name: build-latest-image-arz
    image: woodpeckerci/plugin-docker-buildx:6.1.0
    settings:
      repo: *docker_repo
      registry: *registry_url
      dockerfile: ./Dockerfile
      tags:
        - arz
        - arz-latest
        - arz-latest-${CI_COMMIT_SHA}
      username:
        from_secret: REGISTRY_USERNAME
      password:
        from_secret: REGISTRY_SECRET
      build_args:
        DIALECT: arz
        CI_COMMIT_SHA: ${CI_COMMIT_SHA}
        CI_REPO_URL: ${CI_REPO_URL}
        CI_PIPELINE_CREATED: ${CI_PIPELINE_CREATED}
    depends_on:
      - run-pre-commit-hooks
      - check-lockfile
      - run-tests

  - name: build-latest-image-ckb
    image: woodpeckerci/plugin-docker-buildx:6.1.0
    settings:
      repo: *docker_repo
      registry: *registry_url
      dockerfile: ./Dockerfile
      tags:
        - ckb
        - ckb-latest
        - ckb-latest-${CI_COMMIT_SHA}
      username:
        from_secret: REGISTRY_USERNAME
      password:
        from_secret: REGISTRY_SECRET
      build_args:
        DIALECT: ckb
        CI_COMMIT_SHA: ${CI_COMMIT_SHA}
        CI_REPO_URL: ${CI_REPO_URL}
        CI_PIPELINE_CREATED: ${CI_PIPELINE_CREATED}
    depends_on:
      - run-pre-commit-hooks
      - check-lockfile
      - run-tests

  - name: notify-slack-latest-success
    image: plugins/slack:1.4.1
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: *slack_channel
      template: *success_message
    when:
      - status: success
    depends_on:
      - run-pre-commit-hooks
      - check-lockfile
      - run-tests
      - build-latest-image-acm
      - build-latest-image-arz
      - build-latest-image-ckb

  - name: notify-slack-latest-failure
    image: plugins/slack:1.4.1
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: *slack_channel
      template: *failure_message
    when:
      - status: failure
    depends_on:
      - run-pre-commit-hooks
      - check-lockfile
      - run-tests
      - build-latest-image-acm
      - build-latest-image-arz
      - build-latest-image-ckb
