# Hand-maintained (2.0): one image, no per-dialect matrix, so nothing here is
# generated. Which dialects exist is a DEPLOY-time fact (the models volume),
# not a build-time one; adding a dialect touches neither this file nor the
# image.
when:
  - event: [push, manual]
    branch:
      exclude: [main]
  - event: [pull_request]
    evaluate: 'CI_COMMIT_TARGET_BRANCH != "main"'

variables:
  - &registry_url "https://registry.cloud.josa.ngo"
  - &docker_repo "registry.cloud.josa.ngo/library/nuha-api"
  - &slack_channel "builds"
  - &success_message >
    ✅ *SUCCESS* - Latest Build #{{ build.number }}

    📁 *Repository:* {{ repo.name }}
    🌿 *Branch:* {{ build.branch }}
    📝 *Commit:* {{ truncate build.commit 8 }}
    👤 *Author:* {{ build.author }}

    🔗 *Links:*
    • <{{ build.link }}|View Build>
  - &failure_message >
    ❌ *FAILED* - Latest Build #{{ build.number }}

    📁 *Repository:* {{ repo.name }}
    🌿 *Branch:* {{ build.branch }}
    📝 *Commit:* {{ truncate build.commit 8 }}
    👤 *Author:* {{ build.author }}

    🔗 *Links:*
    • <{{ build.link }}|View Build>

steps:
  - name: run-pre-commit-hooks
    image: registry.cloud.josa.ngo/library/pre-commit-runner
    settings:
      args: "--all-files"
      skip: "end-of-file-fixer, run-samplr"

  # Verify requirements.lock has not drifted from requirements.txt: regenerate
  # it in this pinned Python and fail if the committed lock differs. Catches a
  # requirements.txt change that forgot to regenerate the lock.
  - name: check-lockfile
    image: python:3.12-slim@sha256:423ed6ab25b1921a477529254bfeeabf5855151dc2c3141699a1bfc852199fbf
    commands:
      - pip install --no-cache-dir pip-tools==7.5.3
      - python scripts/check_lock.py

  # ONE pytest run covers every dialect and every layer BEFORE the image is
  # built, so an untested change can never reach a pushed image. Runtime deps
  # come from the same hashed lock the image installs; the suite discovers the
  # dialect files itself, so a new dialect is tested with no CI edit.
  - name: run-tests
    image: python:3.12-slim@sha256:423ed6ab25b1921a477529254bfeeabf5855151dc2c3141699a1bfc852199fbf
    commands:
      - pip install --no-cache-dir --require-hashes -r requirements.lock
      - pip install --no-cache-dir -r requirements-test.txt
      - python -m pytest -q

  # ONE image for the whole service; models are not baked in (the deploy's
  # fetch service installs them onto the models volume). Published tags are
  # channel-first: latest-api plus the checksum-pinned latest-<sha>-api for
  # rollback, the only prefixes the registry's cleanup policy keeps. No bare
  # tag is pushed: this pipeline runs on every non-main branch, so a bare tag
  # would let any WIP push overwrite the default a deploy pulls; compose picks
  # a channel via NUHA_API_TAG instead. The `api` slot in the tag grammar is a
  # RESERVED dialect code (app/common/dialect_schema.py), so it can never
  # collide with a real dialect's 1.x image tag in this same repo. The build
  # depends on every gate, so a drifted lock or a failing test blocks the push.
  - name: build-latest-image
    image: woodpeckerci/plugin-docker-buildx:6.1.0@sha256:33263f74a593ddef5d4faeb39ae9f87db14d64d8aae8186284ae6e90d89298a4
    # Publish ONLY on push/manual events: pull_request events run the full test
    # gates above but must not overwrite a channel tag that deploys track.
    when:
      - event: [push, manual]
    settings:
      repo: *docker_repo
      registry: *registry_url
      dockerfile: ./Dockerfile
      tags:
        - latest-api
        - latest-${CI_COMMIT_SHA}-api
      username:
        from_secret: REGISTRY_USERNAME
      password:
        from_secret: REGISTRY_SECRET
      build_args:
        CI_COMMIT_SHA: ${CI_COMMIT_SHA}
        CI_REPO_URL: ${CI_REPO_URL}
        CI_PIPELINE_CREATED: ${CI_PIPELINE_CREATED}
    depends_on:
      - run-pre-commit-hooks
      - check-lockfile
      - run-tests

  - name: notify-slack-latest-success
    image: plugins/slack:1.4.1@sha256:4bf835c9636bfd2b2e30c6051b0e73513ef565de75dc5e31d0b6e4491c6fe012
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: *slack_channel
      template: *success_message
    when:
      - status: success
    depends_on:
      - run-pre-commit-hooks
      - check-lockfile
      - run-tests
      - build-latest-image

  - name: notify-slack-latest-failure
    image: plugins/slack:1.4.1@sha256:4bf835c9636bfd2b2e30c6051b0e73513ef565de75dc5e31d0b6e4491c6fe012
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: *slack_channel
      template: *failure_message
    when:
      - status: failure
    depends_on:
      - run-pre-commit-hooks
      - check-lockfile
      - run-tests
      - build-latest-image
