when:
  - event: [push, manual]
    branch:
      exclude: [main]
  - event: [pull_request]
    evaluate: 'CI_COMMIT_TARGET_BRANCH != "main"'

variables:
  - &registry_url "https://registry.cloud.josa.ngo"
  - &docker_repo "registry.cloud.josa.ngo/library/nuha-api"
  - &slack_channel "builds"
  - &success_message >
    ✅ *SUCCESS* - Latest Build #{{ build.number }}

    📁 *Repository:* {{ repo.name }}
    🌿 *Branch:* {{ build.branch }}
    📝 *Commit:* {{ truncate build.commit 8 }}
    👤 *Author:* {{ build.author }}

    🔗 *Links:*
    • <{{ build.link }}|View Build>
  - &failure_message >
    ❌ *FAILED* - Latest Build #{{ build.number }}

    📁 *Repository:* {{ repo.name }}
    🌿 *Branch:* {{ build.branch }}
    📝 *Commit:* {{ truncate build.commit 8 }}
    👤 *Author:* {{ build.author }}

    🔗 *Links:*
    • <{{ build.link }}|View Build>

steps:
  - name: run-pre-commit-hooks
    image: registry.cloud.josa.ngo/library/pre-commit-runner
    settings:
      args: "--all-files"
      skip: "end-of-file-fixer, run-samplr"

  # Verify requirements.lock has not drifted from requirements.txt: regenerate
  # it in this pinned Python and fail if the committed lock differs. Catches a
  # requirements.txt change that forgot to regenerate the lock.
  - name: check-lockfile
    image: python:3.12-slim
    commands:
      - pip install --no-cache-dir pip-tools==7.5.3
      - python scripts/check_lock.py

  # One image PER DIALECT: each bakes only its own model (selected by the
  # DIALECT build_arg, which the Dockerfile reads to download that dialect's
  # hf_repo from app/dialects/<code>.json). The dialect code is the image tag
  # (nuha-api:arz, ...), matching how compose tags them via
  # ${NUHA_IMAGE_PREFIX}:<code>. Each dialect also gets channel + SHA-pinned
  # tags (<code>-latest, <code>-latest-${CI_COMMIT_SHA}) for rollback. The
  # buildx-plugin CI_* metadata args are preserved and the model repos are still
  # read from app/dialects/ at build time (public repos, no HF token).
  - name: build-latest-image-arz
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: *docker_repo
      registry: *registry_url
      dockerfile: ./Dockerfile
      tags:
        - arz
        - arz-latest
        - arz-latest-${CI_COMMIT_SHA}
      username:
        from_secret: REGISTRY_USERNAME
      password:
        from_secret: REGISTRY_SECRET
      build_args:
        - DIALECT=arz
        - CI_COMMIT_SHA=${CI_COMMIT_SHA}
        - CI_REPO_URL=${CI_REPO_URL}
        - CI_PIPELINE_CREATED=${CI_PIPELINE_CREATED}
    depends_on:
      - run-pre-commit-hooks
      # The lock check always runs (it is cheap next to the image build), so the
      # build waits on it and a drift failure blocks the build, so a stale-lock
      # image is never pushed.
      - check-lockfile

  - name: build-latest-image-acm
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: *docker_repo
      registry: *registry_url
      dockerfile: ./Dockerfile
      tags:
        - acm
        - acm-latest
        - acm-latest-${CI_COMMIT_SHA}
      username:
        from_secret: REGISTRY_USERNAME
      password:
        from_secret: REGISTRY_SECRET
      build_args:
        - DIALECT=acm
        - CI_COMMIT_SHA=${CI_COMMIT_SHA}
        - CI_REPO_URL=${CI_REPO_URL}
        - CI_PIPELINE_CREATED=${CI_PIPELINE_CREATED}
    depends_on:
      - run-pre-commit-hooks
      - check-lockfile

  - name: build-latest-image-ckb
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: *docker_repo
      registry: *registry_url
      dockerfile: ./Dockerfile
      tags:
        - ckb
        - ckb-latest
        - ckb-latest-${CI_COMMIT_SHA}
      username:
        from_secret: REGISTRY_USERNAME
      password:
        from_secret: REGISTRY_SECRET
      build_args:
        - DIALECT=ckb
        - CI_COMMIT_SHA=${CI_COMMIT_SHA}
        - CI_REPO_URL=${CI_REPO_URL}
        - CI_PIPELINE_CREATED=${CI_PIPELINE_CREATED}
    depends_on:
      - run-pre-commit-hooks
      - check-lockfile

  - name: notify-slack-latest-success
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: *slack_channel
      template: *success_message
    when:
      - status: success
    depends_on:
      - run-pre-commit-hooks
      - check-lockfile
      - build-latest-image-arz
      - build-latest-image-acm
      - build-latest-image-ckb

  - name: notify-slack-latest-failure
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: *slack_channel
      template: *failure_message
    when:
      - status: failure
    depends_on:
      - run-pre-commit-hooks
      - check-lockfile
      - build-latest-image-arz
      - build-latest-image-acm
      - build-latest-image-ckb
