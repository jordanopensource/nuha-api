when:
  - event: [push, manual]
    branch: [main]
  - event: [pull_request]
    evaluate: 'CI_COMMIT_TARGET_BRANCH == "main"'
    branch:
      exclude: [main]

variables:
  - &registry_url "https://registry.cloud.josa.ngo"
  - &docker_repo "registry.cloud.josa.ngo/library/nuha-api"
  - &slack_channel "builds"
  - &success_message >
    ✅ *SUCCESS* - Stable Build #{{ build.number }}

    📁 *Repository:* {{ repo.name }}
    🌿 *Branch:* {{ build.branch }}
    📝 *Commit:* {{ truncate build.commit 8 }}
    👤 *Author:* {{ build.author }}

    🔗 *Links:*
    • <{{ build.link }}|View Build>
  - &failure_message >
    ❌ *FAILED* - Stable Build #{{ build.number }}

    📁 *Repository:* {{ repo.name }}
    🌿 *Branch:* {{ build.branch }}
    📝 *Commit:* {{ truncate build.commit 8 }}
    👤 *Author:* {{ build.author }}

    🔗 *Links:*
    • <{{ build.link }}|View Build>

steps:
  - name: run-pre-commit-hooks
    image: registry.cloud.josa.ngo/library/pre-commit-runner
    settings:
      args: "--all-files"
      skip: "end-of-file-fixer, run-samplr"

  # Verify requirements.lock has not drifted from requirements.txt: regenerate
  # it in this pinned Python and fail if the committed lock differs. Catches a
  # requirements.txt change that forgot to regenerate the lock.
  - name: check-lockfile
    image: python:3.12-slim
    commands:
      - pip install --no-cache-dir pip-tools==7.5.3
      - python scripts/check_lock.py

  - name: build-stable-image
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: *docker_repo
      registry: *registry_url
      dockerfile: ./Dockerfile
      tags:
        - stable-${CI_COMMIT_SHA}
        - stable
      username:
        from_secret: REGISTRY_USERNAME
      password:
        from_secret: REGISTRY_SECRET
      # Only pass build_args that have corresponding ARGs in the Dockerfile.
      # Model repos are read from app/dialects/<code>.json at build time (not
      # build_args), and all repos are public, so no HF token is needed.
      build_args:
        - CI_COMMIT_SHA=${CI_COMMIT_SHA}
        - CI_REPO_URL=${CI_REPO_URL}
        - CI_PIPELINE_CREATED=${CI_PIPELINE_CREATED}
    depends_on:
      - run-pre-commit-hooks
      # The lock check always runs (it is cheap next to the image build), so the
      # build waits on it and a drift failure blocks the build, so a stale-lock
      # image is never pushed.
      - check-lockfile

  - name: notify-slack-stable-success
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: *slack_channel
      template: *success_message
    when:
      - status: success
    depends_on:
      - run-pre-commit-hooks
      - build-stable-image

  - name: notify-slack-stable-failure
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: *slack_channel
      template: *failure_message
    when:
      - status: failure
    depends_on:
      - run-pre-commit-hooks
      - build-stable-image
