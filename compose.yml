# Nuha API 2.0: one public api service backed by a models VOLUME.
#
# The api mounts the volume read-only and scans it once at startup. The fetch
# service (same image, read-write, the volume's only writer) installs and
# removes models at runtime:
#
#   docker compose run --rm fetch add <code>     # or: add --all / remove <code>
#   docker compose restart api
#
# No image rebuild, no edit here: which dialects exist is decided by the
# volume's contents. Compose only REPORTS health (a hung-but-alive container
# needs operator action); TLS and rate limiting belong to the platform edge.
name: nuha-api

services:
  api:
    image: ${NUHA_API_IMAGE:-nuha-api}:${NUHA_API_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # The process needs no Linux capabilities and must never gain privileges:
    # plain hardening for the one public container.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Above the engine's inner budget (INFERENCE_QUEUE_TIMEOUT 30 +
    # INFERENCE_TIMEOUT 120 = 150s worst-case admitted request), so the
    # restart after a fetch DRAINS in-flight work instead of killing it.
    # Pinned by tests/test_timeout_ordering.py.
    stop_grace_period: 160s
    env_file:
      - path: .env
        required: false
    environment:
      - MODELS_DIR=/models
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - models:/models:ro
    healthcheck:
      # /ready gates traffic on the startup scan (all present models loaded);
      # start_period covers N sequential model loads, not just process start.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          # The ceiling covers the SUM of all loaded models in ONE process
          # (the shipped three peak at ~1.4-2.2 GiB each) plus the web stack
          # and in-flight bodies. Installing more dialects raises the real
          # footprint; raise API_MEM_LIMIT with it.
          cpus: "${API_CPU_LIMIT:-3.0}"
          memory: ${API_MEM_LIMIT:-10g}

  # The models volume's only writer; needs egress to Hugging Face. Not started
  # by `up` (profile), and `docker compose run --rm fetch ...` enables the
  # profile implicitly.
  fetch:
    profiles: ["tools"]
    image: ${NUHA_API_IMAGE:-nuha-api}:${NUHA_API_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: .env
        required: false
    environment:
      - MODELS_DIR=/models
    volumes:
      - models:/models
    entrypoint: ["python", "scripts/fetch_models.py"]

volumes:
  models:
