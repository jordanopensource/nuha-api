name: egynuha-api

services:
  api:
    image: josaorg/egynuha-api:stable
    container_name: egynuha-api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import os, urllib.request;
          urllib.request.urlopen(
            f"http://localhost:{os.getenv('PORT', '8000')}/health"
          )
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
