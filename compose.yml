name: nuha-api

x-backend: &backend
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - >
        import urllib.request;
        urllib.request.urlopen("http://localhost:8000/health")
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: nuha-api-proxy
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Dialect used for no-dialect requests (backward compat) and docs routing.
      # Filled into the generated routing config at container start by nginx's
      # built-in envsubst; NGINX_ENVSUBST_FILTER limits substitution to this one
      # var so nginx's own $variables are left intact.
      - DEFAULT_DIALECT=${DEFAULT_DIALECT:-arz}
      - NGINX_ENVSUBST_FILTER=DEFAULT_DIALECT
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Committed, generated routing template (one entry per dialect). nginx
      # renders /etc/nginx/conf.d/dialects.conf from it at startup.
      - ./nginx/dialects.conf.template:/etc/nginx/templates/dialects.conf.template:ro
    deploy:
      resources:
        limits:
          cpus: "${PROXY_CPU_LIMIT:-1.0}"
          memory: ${PROXY_MEM_LIMIT:-256m}
    depends_on:
      nuha-api-acm:
        condition: service_healthy
      nuha-api-arz:
        condition: service_healthy
      nuha-api-ckb:
        condition: service_healthy

  nuha-api-acm:
    <<: *backend
    image: ${NUHA_IMAGE_PREFIX:-nuha-api}:acm
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DIALECT=acm
    environment:
      - DIALECT=acm
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "${BACKEND_CPU_LIMIT:-2.0}"
          memory: 4g
        reservations:
          memory: ${BACKEND_MEM_RESERVATION:-512m}

  nuha-api-arz:
    <<: *backend
    image: ${NUHA_IMAGE_PREFIX:-nuha-api}:arz
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DIALECT=arz
    environment:
      - DIALECT=arz
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "${BACKEND_CPU_LIMIT:-2.0}"
          memory: 4g
        reservations:
          memory: ${BACKEND_MEM_RESERVATION:-512m}

  nuha-api-ckb:
    <<: *backend
    image: ${NUHA_IMAGE_PREFIX:-nuha-api}:ckb
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DIALECT=ckb
    environment:
      - DIALECT=ckb
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "${BACKEND_CPU_LIMIT:-2.0}"
          memory: 4g
        reservations:
          memory: ${BACKEND_MEM_RESERVATION:-512m}
