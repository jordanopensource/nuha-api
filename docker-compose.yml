# =============================================================================
# EgyNuha API - Docker Compose Configuration
# =============================================================================
# Usage:
#   Development:  docker compose up
#   Production:   docker compose -f docker-compose.yml up -d
#
# Copy .sample.env to .env and adjust values before running.
# =============================================================================

services:
  api:
    image: josaorg/egynuha-api:stable
    container_name: egynuha-api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(f'http://localhost:{os.getenv(\"PORT\",\"8000\")}/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Uncomment below for GPU support (requires nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
